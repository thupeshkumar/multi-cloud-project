global:
  scrape_interval: 30s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: origins
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://184.197.92.35/health"]
        labels: {cloud: aws}
      - targets: ["http://20.69.109.11/health"]
        labels: {cloud: azure}
      - targets: ["http://34.41.25.119/health"]
        labels: {cloud: gcp}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
