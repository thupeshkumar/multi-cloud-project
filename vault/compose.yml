services:
  vault:
    image: hashicorp/vault:latest
    container_name: multicloud-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8201:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./config:/vault/config:ro
      - vault-data:/vault/file
    command: server

volumes:
  vault-data: